<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロフィール設定 - 創作・キャラクター投稿コミュニティ</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; color: #333; }
        
        /* 全体レイアウト */
        .app-layout { display: flex; min-height: 100vh; position: relative; }
        
        /* pixiv風サイドバー */
        sidebar { width: 220px; background: #ffffff; border-right: 1px solid #e1e4e8; padding: 20px 12px; display: flex; flex-direction: column; gap: 8px; position: sticky; top: 0; height: 100vh; box-sizing: border-box; flex-shrink: 0; transition: transform 0.3s ease; z-index: 1000; }
        .logo-area { font-size: 15px; font-weight: bold; color: #2c3e50; margin-bottom: 5px; padding-left: 5px; display: flex; justify-content: space-between; align-items: center; }
        
        .side-btn { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 8px; color: #333; text-decoration: none; font-size: 14px; font-weight: bold; transition: 0.2s; }
        .side-btn:hover { background: #f0f3f6; color: #3498db; }
        .side-btn.active { background: #eef2f7; color: #3498db; }
        
        .btn-create-main { background: #3498db; color: white !important; border-radius: 8px; text-align: center; justify-content: center; margin-bottom: 5px; box-shadow: 0 4px 10px rgba(52, 152, 219, 0.3); }
        .btn-create-main:hover { background: #2980b9 !important; }

        /* スマホ用ハンバーガーボタン */
        .menu-toggle { display: none; background: #2c3e50; color: white; border: none; padding: 8px 12px; font-size: 14px; border-radius: 6px; cursor: pointer; position: fixed; top: 12px; left: 12px; z-index: 1100; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); z-index: 999; }

        /* メインコンテンツ領域 */
        .main-content { flex: 1; padding: 25px; max-width: 600px; margin: 0 auto; box-sizing: border-box; }
        
        h2 { color: #2c3e50; border-bottom: 2px solid #f0f3f6; padding-bottom: 8px; margin-top: 0; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 13px; color: #555; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        .btn-save { background: #3498db; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 15px; font-weight: bold; width: 100%; cursor: pointer; transition: 0.2s; }
        .btn-save:hover { background: #2980b9; }
        .profile-card { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #e1e4e8; margin-bottom: 20px; }

        @media (max-width: 768px) {
            .menu-toggle { display: block; }
            sidebar { position: fixed; left: -240px; top: 0; height: 100vh; width: 220px; box-shadow: 4px 0 15px rgba(0,0,0,0.1); padding-top: 60px; }
            sidebar.open { left: 0; }
            .sidebar-overlay.open { display: block; }
            .main-content { padding: 60px 15px 20px 15px; }
        }
    </style>
</head>
<body>

<button class="menu-toggle" onclick="toggleSidebar()">☰ メニュー</button>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<div class="app-layout">
    <sidebar id="appSidebar">
        <div class="logo-area">
            <span>🎨 創作コミュニティ</span>
            <span style="cursor:pointer; font-size:18px; padding: 0 5px;" onclick="toggleSidebar()">✕</span>
        </div>
        <a href="/create" class="side-btn btn-create-main">＋ 作成する</a>
        <a href="/" class="side-btn">🏠 ホーム</a>
        <a href="/profile" class="side-btn active">👤 プロフィール</a>
        <a href="/bookmarks.html" class="side-btn">🔖 ブックマーク</a>
    </sidebar>

    <div class="main-content">
        <h2>👤 プロフィール設定</h2>
        
        <div class="profile-card">
            <div class="form-group">
                <label>ユーザー名</label>
                <input type="text" id="usernameInput" placeholder="あなたのユーザー名">
            </div>
            <div class="form-group">
                <label>自己紹介</label>
                <textarea id="bioInput" rows="4" placeholder="自己紹介や得意なジャンルなど"></textarea>
            </div>
            <button class="btn-save" onclick="saveProfile()">保存する</button>
        </div>
    </div>
</div>

<script>
    function toggleSidebar() {
        const sidebar = document.getElementById('appSidebar');
        const overlay = document.getElementById('sidebarOverlay');
        sidebar.classList.toggle('open');
        overlay.classList.toggle('open');
    }

    // 保存されているプロフィールを読み込む
    window.onload = () => {
        const savedUser = localStorage.getItem('currentUser');
        if (savedUser) {
            const user = JSON.parse(savedUser);
            document.getElementById('usernameInput').value = user.username || '';
            document.getElementById('bioInput').value = user.bio || '';
        }
    };

    function saveProfile() {
        const username = document.getElementById('usernameInput').value.trim();
        const bio = document.getElementById('bioInput').value.trim();

        if (!username) {
            alert('ユーザー名は必須です！');
            return;
        }

        const user = { username, bio };
        localStorage.setItem('currentUser', JSON.stringify(user));
        alert('プロフィールを保存しました！');
        location.href = '/';
    }
</script>

</body>
</html>
