<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>プロフィール - 創作・キャラクター投稿コミュニティ</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; color: #333; }
        
        /* 全体レイアウト */
        .app-layout { display: flex; min-height: 100vh; position: relative; }

        /* メインコンテンツ領域 */
        .main-content { flex: 1; padding: 25px; max-width: 700px; margin: 0 auto; box-sizing: border-box; }
        
        h2 { color: #2c3e50; border-bottom: 2px solid #f0f3f6; padding-bottom: 8px; margin-top: 0; }
        .sub-tab-container { display: flex; margin-bottom: 20px; border-bottom: 2px solid #e1e4e8; }
        .sub-tab-btn { flex: 1; padding: 10px; text-align: center; background: #f1f2f6; cursor: pointer; font-weight: bold; color: #555; border: none; font-size: 14px; }
        .sub-tab-btn.active { background: #3498db; color: white; border-radius: 6px 6px 0 0; }
        .form-section { display: none; }
        .form-section.active { display: block; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
        input, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        textarea { resize: vertical; height: 80px; }
        .btn-action { width: 100%; background: #3498db; color: white; border: none; padding: 12px; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-action:hover { background: #2980b9; }
        .user-badge { display: inline-block; background: #f39c12; color: white; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; margin-right: 4px; margin-bottom: 4px; }
        
        .pixiv-profile-header { background: linear-gradient(135deg, #3498db, #9b59b6); color: white; padding: 25px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .pixiv-avatar { width: 80px; height: 80px; background: #fff; color: #333; font-size: 32px; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 50%; margin: 0 auto 10px auto; box-shadow: 0 4px 8px rgba(0,0,0,0.2); overflow: hidden; background-size: cover; background-position: center; }
        
        .edit-card { background: #fff; border: 1px solid #e1e4e8; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .badge-checkbox-group { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 5px; }
        .badge-checkbox-label { display: flex; align-items: center; gap: 5px; font-size: 13px; background: #f8fafc; padding: 6px 10px; border: 1px solid #cbd5e1; border-radius: 6px; cursor: pointer; }

        .post-card { background: #fafafa; border: 1px solid #e1e4e8; border-radius: 8px; padding: 15px; margin-top: 15px; }
        .post-header { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-bottom: 8px; }
        .badge { background: #e74c3c; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
        .badge-novel { background: #9b59b6; }

        @media (max-width: 768px) {
            .main-content { padding: 60px 15px 20px 15px; }
        }
    </style>
</head>
<body>

<!-- サイドバー自動読み込み -->
<script src="/sidebar.js"></script>
<script>
    initSidebar('profile');
</script>

<div class="app-layout">
    <div class="main-content">
        <!-- ログイン・新規登録エリア -->
        <div id="authContainer">
            <div class="sub-tab-container">
                <button class="sub-tab-btn active" onclick="switchAuthTab('login')">🔑 ログイン</button>
                <button class="sub-tab-btn" onclick="switchAuthTab('signup')">📝 新規登録</button>
            </div>

            <!-- ログインフォーム -->
            <div id="loginFormSection" class="form-section active">
                <h2>ログイン</h2>
                <div class="form-group">
                    <label>ユーザー名 または ID</label>
                    <input type="text" id="loginId" placeholder="例：iden または 1">
                </div>
                <div class="form-group">
                    <label>パスワード</label>
                    <input type="password" id="loginPassword" placeholder="パスワードを入力">
                </div>
                <button type="button" class="btn-action" onclick="handleLogin()">ログインする</button>
            </div>

            <!-- 新規登録フォーム -->
            <div id="signupFormSection" class="form-section">
                <h2>新規登録</h2>
                <div class="form-group">
                    <label>ユーザー名</label>
                    <input type="text" id="signupUsername" placeholder="使いたいユーザー名 (例：iden)">
                </div>
                <div class="form-group">
                    <label>パスワード</label>
                    <input type="password" id="signupPassword" placeholder="パスワードを設定">
                </div>
                <button type="button" class="btn-action" style="background: #2ecc71;" onclick="handleSignup()">アカウントを作成する</button>
            </div>
        </div>

        <!-- ログイン後のプロフィールーム -->
        <div id="profileContainer" style="display: none;">
            <div class="pixiv-profile-header">
                <div class="pixiv-avatar" id="profileAvatar">I</div>
                <h2 id="profileName" style="margin: 0; color: white; border: none;">ユーザー名</h2>
                <p id="profileRole" style="font-size: 13px; opacity: 0.9; margin: 5px 0;">権限: 一般</p>
                <p id="profileBio" style="font-size: 14px; margin: 8px 0 0 0; white-space: pre-wrap; opacity: 0.95;"></p>
                <div id="profileBadges" style="margin-top: 10px;"></div>
            </div>

            <!-- プロフィール編集カード -->
            <div class="edit-card">
                <h3>⚙️ プロフィール編集</h3>
                <div class="form-group">
                    <label>アイコン画像変更</label>
                    <input type="file" id="avatarInput" accept="image/*" onchange="previewAvatar(event)">
                </div>
                <div class="form-group">
                    <label>自己紹介文（概要）</label>
                    <textarea id="editBio" placeholder="自己紹介や趣味などを書こう！"></textarea>
                </div>
                <div class="form-group">
                    <label>表示するバッヂを選択（所持バッヂから選べます）</label>
                    <div id="badgeCheckboxes" class="badge-checkbox-group"></div>
                </div>
                <button type="button" class="btn-action" onclick="saveProfile()">プロフィールを保存する</button>
            </div>

            <div style="text-align: right; margin-bottom: 15px;">
                <button onclick="logout()" style="background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px;">ログアウト</button>
            </div>

            <h3>📁 あなたの投稿作品</h3>
            <div id="myPostsList">読み込み中...</div>
        </div>
    </div>
</div>

<script>
    let currentUser = JSON.parse(localStorage.getItem('currentUser')) || null;
    let newAvatarBase64 = '';

    updateProfileView();

    function switchAuthTab(type) {
        const btns = document.querySelectorAll('#authContainer .sub-tab-btn');
        btns.forEach(b => b.classList.remove('active'));
        document.getElementById('loginFormSection').classList.remove('active');
        document.getElementById('signupFormSection').classList.remove('active');

        if (type === 'login') {
            btns[0].classList.add('active');
            document.getElementById('loginFormSection').classList.add('active');
        } else {
            btns[1].classList.add('active');
            document.getElementById('signupFormSection').classList.add('active');
        }
    }

    async function handleSignup() {
        const username = document.getElementById('signupUsername').value.trim();
        const password = document.getElementById('signupPassword').value.trim();
        if (!username || !password) { alert('ユーザー名とパスワードを入力してください！'); return; }

        try {
            const res = await fetch('/api/auth?action=signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const result = await res.json();
            if (res.ok) {
                alert(result.message || '登録成功！');
                currentUser = result.user;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                updateProfileView();
            } else {
                alert('エラー: ' + (result.error || '登録に失敗しました'));
            }
        } catch (err) { alert('通信エラーが発生しました: ' + err.message); }
    }

    async function handleLogin() {
        const loginId = document.getElementById('loginId').value.trim();
        const password = document.getElementById('loginPassword').value.trim();
        if (!loginId || !password) { alert('ユーザー名/IDとパスワードを入力してください！'); return; }

        try {
            const res = await fetch('/api/auth?action=login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ loginId, password })
            });
            const result = await res.json();
            if (res.ok) {
                alert('ログイン成功！おかえりなさい、' + result.user.username + 'さん！');
                currentUser = result.user;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                updateProfileView();
            } else {
                alert('エラー: ' + (result.error || 'ログインに失敗しました'));
            }
        } catch (err) { alert('通信エラーが発生しました: ' + err.message); }
    }

    function logout() {
        currentUser = null;
        localStorage.removeItem('currentUser');
        updateProfileView();
        alert('ログアウトしました');
    }

    function previewAvatar(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            newAvatarBase64 = e.target.result;
            const avatarEl = document.getElementById('profileAvatar');
            avatarEl.style.backgroundImage = `url(${newAvatarBase64})`;
            avatarEl.textContent = '';
        };
        reader.readAsDataURL(file);
    }

    function updateProfileView() {
        const authContainer = document.getElementById('authContainer');
        const profileContainer = document.getElementById('profileContainer');

        if (!currentUser) {
            authContainer.style.display = 'block';
            profileContainer.style.display = 'none';
        } else {
            authContainer.style.display = 'none';
            profileContainer.style.display = 'block';

            document.getElementById('profileName').textContent = currentUser.username;
            document.getElementById('profileRole').textContent = `権限: ${currentUser.role || 'user'} (ID: ${currentUser.id})`;
            document.getElementById('profileBio').textContent = currentUser.bio || '自己紹介がまだ設定されていません。';
            document.getElementById('editBio').value = currentUser.bio || '';

            const avatarEl = document.getElementById('profileAvatar');
            if (currentUser.avatar) {
                avatarEl.style.backgroundImage = `url(${currentUser.avatar})`;
                avatarEl.textContent = '';
                newAvatarBase64 = currentUser.avatar;
            } else {
                avatarEl.style.backgroundImage = '';
                avatarEl.textContent = currentUser.username.charAt(0).toUpperCase();
            }

            // 所持バッヂのチェックボックス生成
            const badgeContainer = document.getElementById('badgeCheckboxes');
            badgeContainer.innerHTML = '';
            const ownedBadges = currentUser.badges ? currentUser.badges.split(',').map(b => b.trim()).filter(Boolean) : [];
            const selectedBadges = currentUser.selected_badges ? currentUser.selected_badges.split(',').map(b => b.trim()).filter(Boolean) : ownedBadges;

            if (ownedBadges.length === 0) {
                badgeContainer.innerHTML = '<span style="font-size:12px; color:#777;">所持しているバッヂはありません。</span>';
            } else {
                ownedBadges.forEach(badge => {
                    const isChecked = selectedBadges.includes(badge);
                    const label = document.createElement('label');
                    label.className = 'badge-checkbox-label';
                    label.innerHTML = `<input type="checkbox" class="badge-chk" value="${badge}" ${isChecked ? 'checked' : ''}> ${badge}`;
                    badgeContainer.appendChild(label);
                });
            }

            // プロフィールヘッダーの選択中バッヂ表示
            const badgesDiv = document.getElementById('profileBadges');
            badgesDiv.innerHTML = '';
            const displayBadges = selectedBadges.length > 0 ? selectedBadges : ownedBadges;
            if (displayBadges.length > 0) {
                displayBadges.forEach(b => {
                    const span = document.createElement('span');
                    span.className = 'user-badge';
                    span.textContent = b;
                    badgesDiv.appendChild(span);
                });
            } else {
                badgesDiv.innerHTML = '<span style="font-size:12px; opacity:0.8;">バッジなし</span>';
            }

            fetchMyPosts(currentUser.username);
        }
    }

    async function saveProfile() {
        if (!currentUser) return;

        const bio = document.getElementById('editBio').value;
        const chkBoxes = document.querySelectorAll('.badge-chk:checked');
        const selectedBadgesArr = [];
        chkBoxes.forEach(chk => selectedBadgesArr.push(chk.value));

        const payload = {
            id: currentUser.id,
            bio: bio,
            avatar: newAvatarBase64,
            selected_badges: selectedBadgesArr.join(', ')
        };

        try {
            const res = await fetch('/api/auth?action=update', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            if (res.ok && result.success) {
                alert('プロフィールを更新しました！');
                currentUser = result.user;
                localStorage.setItem('currentUser', JSON.stringify(currentUser));
                updateProfileView();
            } else {
                alert('エラー: ' + (result.error || '更新に失敗しました'));
            }
        } catch (err) {
            alert('通信エラーが発生しました。');
        }
    }

    async function fetchMyPosts(username) {
        const myPostsList = document.getElementById('myPostsList');
        myPostsList.innerHTML = '<p style="text-align:center; color:#777;">読み込み中...</p>';
        try {
            const res = await fetch('/api/posts');
            const posts = await res.json();
            const myPosts = posts.filter(p => p.author === username);

            if (myPosts.length === 0) {
                myPostsList.innerHTML = '<p style="text-align:center; color:#777;">まだ投稿した作品はありません。</p>';
                return;
            }

            myPostsList.innerHTML = '';
            myPosts.forEach(post => {
                const card = document.createElement('div');
                card.className = 'post-card';
                card.innerHTML = `
                    <div class="post-header">
                        <span><span class="badge ${post.type === 'novel' ? 'badge-novel' : ''}">${post.type === 'character' ? 'キャラシ' : '小説'}</span> (ID: ${post.id})</span>
                        <span>${post.created_at || ''}</span>
                    </div>
                    <h3 style="margin: 5px 0 10px 0;">${post.title}</h3>
                    <p style="white-space: pre-wrap; font-size:14px; background:#fff; padding:10px; border-radius:4px; border:1px solid #eee;">${post.content ? post.content.substring(0, 50) : ''}...</p>
                `;
                myPostsList.appendChild(card);
            });
        } catch (err) {
            myPostsList.innerHTML = '<p style="color:red; text-align:center;">データの取得に失敗しました。</p>';
        }
    }
</script>

</body>
</html>
