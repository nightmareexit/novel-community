<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>小説詳細 - 創作・キャラクター投稿コミュニティ</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; color: #333; }
        
        /* 全体レイアウト */
        .app-layout { display: flex; min-height: 100vh; position: relative; }

        /* メインコンテンツ領域 */
        .main-content { flex: 1; padding: 25px; max-width: 750px; margin: 0 auto; box-sizing: border-box; }
        
        h2 { color: #2c3e50; border-bottom: 2px solid #f0f3f6; padding-bottom: 10px; margin-top: 0; }
        .badge-novel { background: #9b59b6; color: white; padding: 2px 6px; border-radius: 4px; font-size: 11px; }
        .novel-content { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #e1e4e8; line-height: 1.8; white-space: pre-wrap; font-size: 15px; margin-top: 15px; }
        .manage-panel { background: #f8fafc; border: 1px dashed #cbd5e1; padding: 12px; border-radius: 8px; margin-bottom: 20px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .btn-edit { background: #3498db; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-private { background: #f39c12; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
        
        #editModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 20px; border-radius: 8px; width: 90%; max-width: 500px; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        .modal-content input, .modal-content textarea, .modal-content select { width: 100%; padding: 8px; margin-top: 5px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }

        @media (max-width: 768px) {
            .main-content { padding: 60px 15px 20px 15px; }
        }
    </style>
</head>
<body>

<!-- サイドバー自動読み込み -->
<script src="/sidebar.js"></script>
<script>
    initSidebar('');
</script>

<div class="app-layout">
    <div class="main-content">
        <a href="/" style="background:#7f8c8d; color:white; display:inline-block; margin-bottom:15px; padding:6px 12px; width:auto; border-radius:6px; text-decoration:none; font-size:13px;">← ホームに戻る</a>
        
        <div id="novelDetailContainer">
            <p style="text-align:center; color:#777;">読み込み中...</p>
        </div>
    </div>
</div>

<!-- 編集モーダル -->
<div id="editModal">
    <div class="modal-content">
        <h3>✏️ 小説の編集</h3>
        <label>タイトル</label>
        <input type="text" id="editTitle">
        
        <label>ステータス（公開設定）</label>
        <select id="editStatus">
            <option value="public">公開</option>
            <option value="private">非公開</option>
        </select>

        <label>本文</label>
        <textarea id="editContent" rows="8"></textarea>
        
        <div style="text-align: right; gap: 8px; display: flex; justify-content: flex-end;">
            <button onclick="closeEditModal()" style="background:#7f8c8d; color:white; padding:8px 14px; border:none; border-radius:4px; cursor:pointer;">キャンセル</button>
            <button onclick="saveEdit()" class="btn-edit" style="padding: 8px 16px;">保存する</button>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    let novelId = urlParams.get('id');

    if (!novelId) {
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const novelIndex = pathSegments.indexOf('novel');
        if (novelIndex !== -1 && pathSegments.length > novelIndex + 1) {
            novelId = pathSegments[novelIndex + 1];
        } else if (pathSegments.length > 0) {
            novelId = pathSegments[pathSegments.length - 1];
        }
    }

    const container = document.getElementById('novelDetailContainer');
    if (!novelId || novelId === 'novel' || isNaN(novelId)) {
        container.innerHTML = `
            <p style="text-align:center; color:#e74c3c;">小説のIDが正しく指定されていません。</p>
            <div style="text-align:center; margin-top:20px;">
                <a href="/" style="background:#3498db; color:white; display:inline-block; padding:10px 20px; border-radius:6px; text-decoration:none;">ホームに戻る</a>
            </div>
        `;
        throw new Error("ID未指定のため停止");
    }

    let currentPost = null;

    async function fetchNovelDetail() {
        try {
            const res = await fetch(`/api/detail?type=post&target_type=novel&id=${novelId}`);
            const result = await res.json();

            if (!res.ok || !result.success) {
                container.innerHTML = `<p style="color:red; text-align:center;">${result.error || '小説が見つかりませんでした。'}</p>`;
                return;
            }

            currentPost = result.post;
            renderPage();
        } catch (err) {
            container.innerHTML = '<p style="color:red; text-align:center;">データの取得中に通信エラーが発生しました。</p>';
        }
    }

    function renderPage() {
        const savedUser = localStorage.getItem('currentUser');
        const currentUser = savedUser ? JSON.parse(savedUser) : null;
        const isOwner = currentUser && currentUser.username === currentPost.author;

        const statusBadge = currentPost.status === 'private' ? '<span style="background:#e74c3c; color:white; padding:2px 6px; border-radius:4px; font-size:10px; margin-left:5px;">非公開</span>' : '';

        const managePanelHtml = isOwner ? `
            <div class="manage-panel">
                <span style="font-size:12px; font-weight:bold; color:#555;">🛠️ 管理メニュー:</span>
                <button class="btn-edit" onclick="openEditModal()">✏️ 編集</button>
                <button class="btn-private" onclick="toggleStatus()">${currentPost.status === 'private' ? '🔓 公開にする' : '🔒 非公開にする'}</button>
                <button class="btn-delete" onclick="deletePost()">🗑️ 削除</button>
            </div>
        ` : '';

        // ▼ ここを /profile.html に修正済み！
        container.innerHTML = `
            ${managePanelHtml}

            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
                <div><span class="badge-novel">小説・シナリオ</span>${statusBadge}</div>
                <span style="font-size: 13px; color: #666;">作者: <a href="/profile.html?username=${currentPost.author}" style="color: #9b59b6; text-decoration: none; font-weight: bold;">${currentPost.author}</a> (ID: ${currentPost.id})</span>
            </div>
            <h2>${currentPost.title}</h2>
            <div class="novel-content">${currentPost.content}</div>
            <div style="margin-top: 15px; font-size: 12px; color: #888; text-align: right;">投稿日時: ${currentPost.created_at || '不明'}</div>
        `;
    }

    function openEditModal() {
        document.getElementById('editTitle').value = currentPost.title;
        document.getElementById('editContent').value = currentPost.content;
        document.getElementById('editStatus').value = currentPost.status || 'public';
        document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    async function saveEdit() {
        const savedUser = localStorage.getItem('currentUser');
        const currentUser = savedUser ? JSON.parse(savedUser) : null;
        if (!currentUser) { alert('ログインしてください。'); return; }

        const title = document.getElementById('editTitle').value;
        const content = document.getElementById('editContent').value;
        const status = document.getElementById('editStatus').value;

        try {
            const res = await fetch('/api/manage', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: novelId, username: currentUser.username, title, content, status })
            });
            const result = await res.json();
            if (result.success) {
                alert('更新しました！');
                closeEditModal();
                fetchNovelDetail();
            } else { alert('エラー: ' + result.error); }
        } catch (err) { alert('通信エラーが発生しました。'); }
    }

    async function toggleStatus() {
        const savedUser = localStorage.getItem('currentUser');
        const currentUser = savedUser ? JSON.parse(savedUser) : null;
        if (!currentUser) return;

        const newStatus = currentPost.status === 'private' ? 'public' : 'private';
        try {
            const res = await fetch('/api/manage', {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: novelId, username: currentUser.username, status: newStatus })
            });
            const result = await res.json();
            if (result.success) { currentPost.status = newStatus; renderPage(); }
            else { alert('エラー: ' + result.error); }
        } catch (err) { alert('通信エラーが発生しました。'); }
    }

    async function deletePost() {
        const savedUser = localStorage.getItem('currentUser');
        const currentUser = savedUser ? JSON.parse(savedUser) : null;
        if (!currentUser) { alert('ログインしてください。'); return; }

        if (!confirm('本当にこの作品を削除しますか？')) return;

        try {
            const res = await fetch(`/api/manage?id=${novelId}&username=${encodeURIComponent(currentUser.username)}`, { method: 'DELETE' });
            const result = await res.json();
            if (result.success) { alert('削除しました。'); location.href = '/'; }
            else { alert('エラー: ' + result.error); }
        } catch (err) { alert('通信エラーが発生しました。'); }
    }

    fetchNovelDetail();
</script>

</body>
</html>
