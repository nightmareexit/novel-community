<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ユーザープロフィール - 創作・キャラクター投稿コミュニティ</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f6f9; margin: 0; padding: 0; color: #333; }
        
        /* 全体レイアウト */
        .app-layout { display: flex; min-height: 100vh; position: relative; }

        /* メインコンテンツ領域 */
        .main-content { flex: 1; padding: 25px; max-width: 750px; margin: 0 auto; box-sizing: border-box; }
        
        .pixiv-profile-header { background: linear-gradient(135deg, #3498db, #9b59b6); color: white; padding: 25px; border-radius: 8px; margin-bottom: 20px; text-align: center; }
        .pixiv-avatar { width: 80px; height: 80px; background: #fff; color: #333; font-size: 32px; font-weight: bold; display: flex; align-items: center; justify-content: center; border-radius: 50%; margin: 0 auto 10px auto; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .user-badge { display: inline-block; background: #f39c12; color: white; padding: 3px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; margin-right: 4px; margin-bottom: 4px; }
        .post-card { background: #fafafa; border: 1px solid #e1e4e8; border-radius: 8px; padding: 15px; margin-top: 15px; cursor: pointer; transition: 0.2s; }
        .post-card:hover { border-color: #3498db; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        .post-header { display: flex; justify-content: space-between; font-size: 12px; color: #666; margin-bottom: 8px; }
        .badge { background: #e74c3c; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; }
        .badge-novel { background: #9b59b6; }

        @media (max-width: 768px) {
            .main-content { padding: 60px 15px 20px 15px; }
        }
    </style>
</head>
<body>

<!-- サイドバー自動読み込み -->
<script src="/sidebar.js"></script>
<script>
    initSidebar('');
</script>

<div class="app-layout">
    <div class="main-content">
        <a href="/" style="background:#7f8c8d; color:white; display:inline-block; margin-bottom:15px; padding:6px 12px; width:auto; border-radius:6px; text-decoration:none; font-size:13px;">← ホームに戻る</a>
        
        <div id="userContainer">
            <p style="text-align:center; color:#777;">読み込み中...</p>
        </div>
    </div>
</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    let userParam = urlParams.get('username') || urlParams.get('id');

    if (!userParam) {
        const pathSegments = window.location.pathname.split('/').filter(Boolean);
        const userIndex = pathSegments.indexOf('user');
        if (userIndex !== -1 && pathSegments.length > userIndex + 1) {
            userParam = pathSegments[userIndex + 1];
        } else if (pathSegments.length > 0) {
            userParam = pathSegments[pathSegments.length - 1];
        }
    }

    async function fetchUserProfile() {
        const container = document.getElementById('userContainer');
        if (!userParam || userParam === 'user') {
            container.innerHTML = '<p style="color:red; text-align:center;">ユーザーが指定されていません。</p>';
            return;
        }

        try {
            const isId = !isNaN(userParam);
            const queryKey = isId ? `id=${userParam}` : `username=${userParam}`;
            
            const res = await fetch(`/api/detail?type=user&${queryKey}`);
            const result = await res.json();

            if (!res.ok || !result.success) {
                container.innerHTML = `<p style="color:red; text-align:center;">${result.error || 'ユーザーが見つかりませんでした。'}</p>`;
                return;
            }

            const user = result.user;
            const posts = result.posts;

            let badgesHtml = '';
            if (user.badges) {
                user.badges.split(',').forEach(b => {
                    badgesHtml += `<span class="user-badge">${b.trim()}</span>`;
                });
            } else {
                badgesHtml = '<span style="font-size:12px; opacity:0.8;">バッジなし</span>';
            }

            let postsHtml = '';
            if (posts.length === 0) {
                postsHtml = '<p style="text-align:center; color:#777; margin-top:20px;">このユーザーの投稿作品はまだありません。</p>';
            } else {
                posts.forEach(post => {
                    const targetPage = post.type === 'character' ? 'chara.html' : 'novel.html';
                    postsHtml += `
                        <div class="post-card" onclick="location.href='/${targetPage}?id=${post.id}'">
                            <div class="post-header">
                                <span><span class="badge ${post.type === 'novel' ? 'badge-novel' : ''}">${post.type === 'character' ? 'キャラシ' : '小説'}</span> (ID: ${post.id})</span>
                                <span>${post.created_at || ''}</span>
                            </div>
                            <h3 style="margin: 5px 0 10px 0;">${post.title}</h3>
                            <p style="white-space: pre-wrap; font-size:14px; background:#fff; padding:10px; border-radius:4px; border:1px solid #eee;">${post.content ? post.content.substring(0, 60) : ''}...</p>
                        </div>
                    `;
                });
            }

            container.innerHTML = `
                <div class="pixiv-profile-header">
                    <div class="pixiv-avatar">${user.username.charAt(0).toUpperCase()}</div>
                    <h2 style="margin: 0; color: white; border: none;">${user.username}</h2>
                    <p style="font-size: 13px; opacity: 0.9; margin: 5px 0;">権限: ${user.role || 'user'} (ID: ${user.id})</p>
                    <div style="margin-top: 10px;">${badgesHtml}</div>
                </div>

                <h3>📁 ${user.username} さんの投稿作品 (${posts.length}件)</h3>
                <div>${postsHtml}</div>
            `;
        } catch (err) {
            container.innerHTML = '<p style="color:red; text-align:center;">データの取得中に通信エラーが発生しました。</p>';
        }
    }

    fetchUserProfile();
</script>

</body>
</html>
